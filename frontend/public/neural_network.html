<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>System Architecture & Data Flow</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=JetBrains+Mono:wght@300;400;500&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-color: #000000;
      --text-color: #f1f3f9;
      --text-muted: #8e99a7;
      
      --cyan: #00e5ff;
      --violet: #8a2be2;
      --amber: #ffb703;
      --orange: #ff5500;
      
      --font-sans: 'Outfit', -apple-system, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      font-family: var(--font-sans);
      overflow: hidden;
      width: 100vw;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
    }

    /* Subtle background ambient glow removed for pure black aesthetic */
    .ambient-glow {
      display: none;
    }

    canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }
  </style>
</head>
<body>

  <div class="ambient-glow"></div>
  <canvas id="flowCanvas"></canvas>

  <script>
    const canvas = document.getElementById('flowCanvas');
    const ctx = canvas.getContext('2d', { alpha: true });

    let width, height;
    let nodes = [];
    let edges = [];
    let particles = [];
    let layerLabels = [];

    const LAYERS = [
      { name: "Telemetry & Profile", count: 8, color: '#00e5ff' },
      { name: "Embeddings / RAG", count: 12, color: '#8a2be2' },
      { name: "RL Policy Engine", count: 12, color: '#ffb703' },
      { name: "Intervention Action", count: 4, color: '#ff5500' }
    ];

    function resize() {
      width = window.innerWidth;
      height = window.innerHeight;
      const dpr = window.devicePixelRatio || 1;
      
      canvas.width = width * dpr;
      canvas.height = height * dpr;
      ctx.scale(dpr, dpr);
      
      initNetwork();
    }
    
    window.addEventListener('resize', resize);

    class Node {
      constructor(layerIdx, nodeIdx, totalInLayer, x, y, color) {
        this.layerIdx = layerIdx;
        this.nodeIdx = nodeIdx;
        this.x = x;
        this.y = y;
        this.baseColor = color;
        
        // Visuals
        this.radius = layerIdx === 0 || layerIdx === 3 ? 8 : 6;
        this.pulse = 0; // Value from 0 to 1 for glow
      }

      draw(ctx) {
        // Base node
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.radius + this.pulse * 2, 0, Math.PI * 2);
        
        if (this.pulse > 0.01) {
          ctx.shadowBlur = 10 * this.pulse;
          ctx.shadowColor = this.baseColor;
          ctx.fillStyle = '#fff';
        } else {
          ctx.shadowBlur = 0;
          ctx.fillStyle = this.baseColor;
          ctx.globalAlpha = 0.4;
        }
        
        ctx.fill();
        ctx.globalAlpha = 1.0;
        ctx.shadowBlur = 0;
        
        // Decay pulse
        if (this.pulse > 0) {
          this.pulse = Math.max(0, this.pulse - 0.05);
        }
      }
      
      trigger() {
        this.pulse = 1.0;
      }
    }

    class Edge {
      constructor(fromNode, toNode) {
        this.from = fromNode;
        this.to = toNode;
        // Random strength determines opacity and speed modifier
        this.strength = Math.random() * 0.7 + 0.3;
      }

      draw(ctx) {
        ctx.beginPath();
        ctx.moveTo(this.from.x, this.from.y);
        ctx.lineTo(this.to.x, this.to.y);
        
        // Gradient for edge
        const grad = ctx.createLinearGradient(this.from.x, this.from.y, this.to.x, this.to.y);
        grad.addColorStop(0, this.from.baseColor);
        grad.addColorStop(1, this.to.baseColor);
        
        ctx.strokeStyle = grad;
        ctx.globalAlpha = 0.05 * this.strength;
        ctx.lineWidth = 1 + this.strength;
        ctx.stroke();
        ctx.globalAlpha = 1.0;
      }
    }

    class Particle {
      constructor(edge) {
        this.edge = edge;
        this.progress = 0;
        // Speed depends on edge strength, increased for faster flow
        this.speed = (0.04 + Math.random() * 0.04) * edge.strength * 2.0;
        this.size = 2 + Math.random() * 3;
        this.color = edge.from.baseColor;
        this.active = true;
      }

      update() {
        this.progress += this.speed;
        if (this.progress >= 1.0) {
          this.active = false;
          // Trigger destination node
          this.edge.to.trigger();
          
          // Spawn new particles from the destination node if it's not the last layer
          if (this.edge.to.layerIdx < LAYERS.length - 1) {
            spawnParticlesFromNode(this.edge.to);
          }
        }
      }

      draw(ctx) {
        if (!this.active) return;
        
        const x = this.edge.from.x + (this.edge.to.x - this.edge.from.x) * this.progress;
        const y = this.edge.from.y + (this.edge.to.y - this.edge.from.y) * this.progress;
        
        const trailLen = 0.05;
        const tailProgress = Math.max(0, this.progress - trailLen);
        const tx = this.edge.from.x + (this.edge.to.x - this.edge.from.x) * tailProgress;
        const ty = this.edge.from.y + (this.edge.to.y - this.edge.from.y) * tailProgress;
        
        ctx.beginPath();
        ctx.moveTo(tx, ty);
        ctx.lineTo(x, y);
        
        ctx.shadowBlur = 10;
        ctx.shadowColor = this.color;
        ctx.strokeStyle = '#fff'; // Bright core
        ctx.lineWidth = this.size * 0.8;
        ctx.lineCap = 'round';
        
        ctx.stroke();
        ctx.shadowBlur = 0;
      }
    }

    function initNetwork() {
      nodes = [];
      edges = [];
      particles = [];
      layerLabels = [];
      
      const paddingX = width * 0.15;
      const startX = paddingX;
      const endX = width - paddingX;
      const stepX = (endX - startX) / (LAYERS.length - 1);
      
      const centerY = height / 2;
      
      // Create Nodes
      for (let l = 0; l < LAYERS.length; l++) {
        const layer = LAYERS[l];
        const x = startX + l * stepX;
        layerLabels.push({ text: layer.name, x: x, y: 50, color: layer.color });
        
        const nodeSpacing = Math.min(45, (height - 120) / layer.count);
        const startY = centerY - (layer.count - 1) * nodeSpacing / 2;
        
        for (let i = 0; i < layer.count; i++) {
          const y = startY + i * nodeSpacing;
          nodes.push(new Node(l, i, layer.count, x, y, layer.color));
        }
      }
      
      // Create Edges
      for (let l = 0; l < LAYERS.length - 1; l++) {
        const fromNodes = nodes.filter(n => n.layerIdx === l);
        const toNodes = nodes.filter(n => n.layerIdx === l + 1);
        
        for (const fromN of fromNodes) {
          // Connect to a subset of nodes in the next layer to avoid complete spaghetti
          // Higher chance to connect to nodes directly across
          for (const toN of toNodes) {
            const dy = Math.abs(fromN.y - toN.y);
            const prob = Math.max(0.1, 1.0 - (dy / (height * 0.6)));
            
            if (Math.random() < prob) {
              edges.push(new Edge(fromN, toN));
            }
          }
        }
      }
    }

    function spawnParticlesFromNode(node) {
      // Find edges leaving this node
      const leavingEdges = edges.filter(e => e.from === node);
      if (leavingEdges.length === 0) return;
      
      // Spawn 1 to 3 particles
      const count = 1 + Math.floor(Math.random() * 2);
      for (let i = 0; i < count; i++) {
        const edge = leavingEdges[Math.floor(Math.random() * leavingEdges.length)];
        particles.push(new Particle(edge));
      }
    }

    function spawnInitialData() {
      // Spawn particles at the input layer
      const inputNodes = nodes.filter(n => n.layerIdx === 0);
      if (inputNodes.length === 0) return;
      
      // Select 1-3 random input nodes
      const count = 1 + Math.floor(Math.random() * 3);
      for (let i = 0; i < count; i++) {
        const node = inputNodes[Math.floor(Math.random() * inputNodes.length)];
        node.trigger();
        spawnParticlesFromNode(node);
      }
    }

    let frameCount = 0;

    function render() {
      ctx.clearRect(0, 0, width, height);
      
      // Add a very subtle trail effect (requires not using clearRect entirely, but we want clean edges)
      // We will stick to clearRect for crispness
      
      ctx.globalCompositeOperation = 'screen';
      
      // Draw edges
      for (const edge of edges) {
        edge.draw(ctx);
      }
      
      // Update and draw particles
      ctx.globalCompositeOperation = 'lighter';
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.update();
        p.draw(ctx);
        if (!p.active) {
          particles.splice(i, 1);
        }
      }
      
      // Draw nodes
      ctx.globalCompositeOperation = 'source-over';
      for (const node of nodes) {
        node.draw(ctx);
      }
      
      // Draw Layer Labels
      ctx.textAlign = 'center';
      for (const label of layerLabels) {
        ctx.fillStyle = label.color;
        ctx.font = '600 14px var(--font-sans)';
        ctx.letterSpacing = '1px';
        ctx.globalAlpha = 0.8;
        ctx.shadowBlur = 8;
        ctx.shadowColor = label.color;
        ctx.fillText(label.text.toUpperCase(), label.x, label.y);
      }
      ctx.globalAlpha = 1.0;
      ctx.shadowBlur = 0;
      
      // Spawn continuously and faster
      frameCount++;
      if (frameCount % 2 === 0) { 
        spawnInitialData();
      }
      
      requestAnimationFrame(render);
    }

    // Initialize
    resize();
    render();
    
    // Initial burst
    for(let i=0; i<5; i++) spawnInitialData();

  </script>
</body>
</html>
