services:
  # 1. PostgreSQL Relational Database (AWS RDS local compatible)
  postgres:
    image: postgres:16-alpine
    container_name: pulseiq-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: pulseiq_user
      POSTGRES_PASSWORD: pulseiq_secure_password
      POSTGRES_DB: pulseiq_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pulseiq_user -d pulseiq_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. Qdrant Vector Database (for RAG Knowledge Assistant)
  qdrant:
    image: qdrant/qdrant:latest
    container_name: pulseiq-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

  # 3. Unified FastAPI Backend (SHAP + RAG + RL + DB + AWS Connectors)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pulseiq-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started
    environment:
      DATABASE_URL: postgresql://pulseiq_user:pulseiq_secure_password@postgres:5432/pulseiq_db
      QDRANT_HOST: qdrant
      QDRANT_PORT: 6333
      QDRANT_COLLECTION_NAME: pulseiq_knowledge
      GROQ_API_KEY: ${GROQ_API_KEY:-dummy}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_S3_BUCKET: ${AWS_S3_BUCKET:-pulseiq-cloud-artifacts}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
    ports:
      - "8000:8000"

  # 4. React SPA Frontend (Nginx Reverse Proxy)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: pulseiq-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"
      - "3000:80"

volumes:
  postgres_data:
  qdrant_data:
